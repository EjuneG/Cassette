productName: Cassette
appId: com.yesplaymusic.app
copyright: Copyright © EjuneG

directories:
  output: dist_electron
  app: .

asar: true
asarUnpack:
  - "**/*.node"
  - "node_modules/@unblockneteasemusic/**"

files:
  - dist/**/*
  - dist-electron/**/*
  - node_modules/**/*
  - package.json

extraMetadata:
  main: dist-electron/main.js

publish:
  - provider: github
    owner: EjuneG
    repo: Cassette
    releaseType: release

win:
  target:
    - target: nsis
      arch:
        - x64
  icon: build/icons/icon.ico

nsis:
  oneClick: true
  perMachine: true
  deleteAppDataOnUninstall: true
  # Default is "Cassette Setup 1.0.0.exe" — the spaces do not match the
  # URL-safe filename electron-updater writes into latest.yml, so auto-update
  # 404s unless the asset is renamed by hand before upload.
  artifactName: ${productName}-Setup-${version}.${ext}

linux:
  target:
    - target: AppImage
      arch:
        - x64
  category: Music
  icon: build/icons

mac:
  target:
    - target: dmg
      arch:
        - x64
        - arm64
  category: public.app-category.music
  icon: build/icons/icon.icns
