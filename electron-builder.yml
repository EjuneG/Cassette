productName: Cassette
appId: com.yesplaymusic.app
copyright: Copyright © EjuneG

directories:
  output: dist_electron
  app: .

asar: true
asarUnpack:
  - "**/*.node"
  - "node_modules/@unblockneteasemusic/**"

files:
  - dist/**/*
  - dist-electron/**/*
  - node_modules/**/*
  - package.json

extraMetadata:
  main: dist-electron/main.js

publish:
  - provider: github
    owner: EjuneG
    repo: Cassette
    releaseType: release

win:
  target:
    - target: nsis
      arch:
        - x64
  icon: build/icons/icon.ico

nsis:
  # oneClick installers give no UI at all and always land in Program Files.
  # The wizard form is what lets people pick a drive/folder.
  oneClick: false
  allowToChangeInstallationDirectory: true
  # Unset perMachine => the wizard opens with an "all users / just me" page.
  # "Just me" needs no UAC (so no admin prompt to install onto D:), and the
  # per-machine branch stays available via allowElevation. Existing
  # per-machine installs are detected in initMultiUser and keep their mode.
  allowElevation: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  deleteAppDataOnUninstall: true
  # Default is "Cassette Setup 1.0.0.exe" — the spaces do not match the
  # URL-safe filename electron-updater writes into latest.yml, so auto-update
  # 404s unless the asset is renamed by hand before upload.
  artifactName: ${productName}-Setup-${version}.${ext}

linux:
  target:
    - target: AppImage
      arch:
        - x64
  category: Music
  icon: build/icons

mac:
  target:
    - target: dmg
      arch:
        - x64
        - arm64
  category: public.app-category.music
  # PNG source — electron-builder generates the .icns itself on the mac
  # runner (no icns tooling exists locally to keep a checked-in one fresh).
  icon: build/icons/icon.png
